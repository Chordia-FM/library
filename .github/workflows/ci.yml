name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# POLYREPO: this crate path-depends on ../contracts and ../i18n. Both are public sibling repos, so
# the default GITHUB_TOKEN can clone them; every job that builds checks them out next to library/
# (all under the runner workspace) so the `path = "../contracts"` / `"../i18n"` deps resolve.

# Least privilege for the default GITHUB_TOKEN. Jobs that need to write something declare it
# themselves, so a compromised third-party action in an ordinary job cannot push, tag or release.
permissions:
  contents: read

jobs:
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: library
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: chordia-fm/contracts
          path: contracts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: chordia-fm/i18n
          path: i18n
      # lld, which `.cargo/config.toml` selects for the Linux target. Linking is most of what a
      # rebuild spends its time on here — the compile is incremental, the link never is.
      # cmake builds libopus for the Discord bot (`opus2` → `libopus_sys`).
      - name: Install lld + cmake
        run: sudo apt-get update && sudo apt-get install -y lld cmake
      # Pinned by commit SHA, so the toolchain the `@stable` ref used to imply is named here.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, resolved 2026-09-12
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: library
          # Deliberately no `cache-on-failure`: `cargo fmt --check` runs first and compiles nothing,
          # so a formatting failure would save an empty entry -- and on a full key match rust-cache
          # skips the save, so nothing could ever replace it.
      - run: cargo fmt --check
        working-directory: library
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: library
      # The desktop app embeds this crate with `default-features = false` (no Discord bot, no
      # libopus), so that configuration has to stay warning-free too.
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
        working-directory: library
      - run: cargo test --all
        working-directory: library

  audit:
    # 2vCPU on purpose: this job is one script/download, never four cores' worth of work.
    # Compile jobs stay at 4 — halving cores on parallel work doubles the time for the same
    # bill, so it would buy latency and nothing else.
    # x86, NOT arm. `cargo-deny-action` ships a prebuilt x86_64 binary inside its
    # container, so on aarch64 it dies with `cannot execute binary file: Exec format
    # error`. "Ships no artifact" is not sufficient to make a job architecture-agnostic —
    # a third-party action can carry a binary of its own. 2vCPU still applies.
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: library
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: chordia-fm/contracts
          path: contracts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: chordia-fm/i18n
          path: i18n
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: library/Cargo.toml

  # On a `v*` tag: publish the GHCR image with semver + `latest` tags (SELF_HOSTING pulls `:latest`).
  image:
    needs: [test, audit]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: library
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: chordia-fm/contracts
          path: contracts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: chordia-fm/i18n
          path: i18n
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/chordia-fm/library
          # From tag v1.2.3 → :1.2.3, :1.2, and :latest.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        with:
          # Workspace root holds library/ + contracts/ + i18n/; the Dockerfile copies the siblings.
          context: .
          file: library/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # On a `v*` tag: build the prebuilt Linux binary and attach it to the GitHub Release, fulfilling
  # the `releases/latest/download/chordia-library-linux-x86_64` install path in SELF_HOSTING.md.
  release:
    needs: [test, audit]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: library
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: chordia-fm/contracts
          path: contracts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: chordia-fm/i18n
          path: i18n
      # lld, which `.cargo/config.toml` selects for the Linux target. Linking is most of what a
      # rebuild spends its time on here — the compile is incremental, the link never is.
      # musl-tools rides along in the same step: it supplies musl-gcc for the bundled libsqlite3 in
      # the static build below, and the `apt-get update` index refresh — most of the cost of an apt
      # step — was being paid twice for two small packages.
      # cmake compiles libopus (the Discord bot's Opus encoder) from source with musl-gcc, so the
      # static binary carries it too.
      - name: Install lld + musl toolchain + cmake
        run: sudo apt-get update && sudo apt-get install -y lld musl-tools cmake
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, resolved 2026-09-12
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: library
          # No `cache-on-failure` here either, for the reason given on the test job above.
      # Static musl build so the "curl and run" install in SELF_HOSTING.md works on any glibc
      # version and on musl distros (Alpine); musl-gcc came from musl-tools, installed above.
      - name: Build static release binary
        run: cargo build --release --target x86_64-unknown-linux-musl
        working-directory: library
        env:
          # cmake-rs hands the C compiler to libopus's build; point it at the musl one.
          CC_x86_64_unknown_linux_musl: musl-gcc
      - name: Stage binary
        run: install -Dm755 library/target/x86_64-unknown-linux-musl/release/chordia-library chordia-library-linux-x86_64
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: chordia-library-linux-x86_64
          generate_release_notes: true
          fail_on_unmatched_files: true
