[package]
name = "chordia-library"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Chordia self-hosted server that scans, indexes, streams, relays, and buffers scrobbles for a user's own music."
license = "AGPL-3.0-or-later"
repository = "https://github.com/chordia-fm/library"

[dependencies]
# Local dev path dep; switch to the published crate once `contracts` ships.
chordia-contracts = { path = "../contracts" }
# The Discord bot's command descriptions in the locales the catalogs cover (embedded at build time).
chordia-i18n = { path = "../i18n", optional = true }

# Web / async
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "cors", "fs", "set-header"] }

# Serialization / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# Local datastore (SQLite - no external service to run)
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "sqlite",
    "macros",
    "migrate",
    "uuid",
] }
uuid = { version = "1", features = ["v7", "serde"] }

# Talk to the Hub (heartbeat, scrobble forward) + relay pulls from peer libraries
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }

# Observability / errors
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
anyhow = "1"

# Metadata + fingerprinting
lofty = "0.21"
symphonia = { version = "0.5", features = ["all"] }
sha2 = "0.10"
hex = "0.4"

# Filesystem watching
notify = "6"

# Random token generation
rand = "0.8"

# Capability-token validation (same crate + feature flags as backend)
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
ed25519-dalek = "2"
base64 = "0.22"

# Streaming
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
mime_guess = "2"
async-stream = "0.3"
futures-core = "0.3"

# Transcoding (lower tiers) shells out to `ffmpeg` via tokio::process - no crate dep.

# Native TLS termination + leaf-cert fingerprint advertisement (the directory pinning model).
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-pemfile = "2"

# Discord music bot (feature `discord`, on by default). The desktop app embeds this crate with
# `default-features = false`, so none of this — and libopus, the one C dependency in the tree — ever enters
# that build. See src/discord/mod.rs for the crate choices.
#
# serenity's default feature set is trimmed to what poise + songbird need. `voice` is the
# VoiceGatewayManager hook songbird registers into.
serenity = { version = "0.12.5", default-features = false, features = [
    "builder",
    "cache",
    "client",
    "collector",
    "framework",
    "gateway",
    "model",
    "rustls_backend",
    "utils",
    "voice",
], optional = true }
poise = { version = "0.6.2", default-features = false, features = ["cache", "handle_panics"], optional = true }
# Voice. DAVE (Discord's mandatory voice E2EE) is built in and pure Rust; Opus encoding goes through
# `opus2` → `libopus_sys`, which links a system libopus via pkg-config or builds it from source with cmake.
songbird = { version = "0.6.0", optional = true }
# Now-playing cards: an SVG template rendered to PNG. `text` shapes titles with the bundled font,
# `system-fonts` adds CJK/emoji fallback where the host has them, `raster-images` decodes the album art.
resvg = { version = "0.48.1", default-features = false, features = [
    "text",
    "system-fonts",
    "raster-images",
], optional = true }

[features]
default = ["discord"]
discord = ["dep:serenity", "dep:poise", "dep:songbird", "dep:resvg", "dep:chordia-i18n"]

[dev-dependencies]
# Generate self-signed certs in tests (no external openssl needed).
rcgen = "0.13"
# Integration tests migrate a real SQLite file: `sqlx::migrate!` needs a path, and an in-memory
# pool would give every connection its own blank database.
tempfile = "3"
