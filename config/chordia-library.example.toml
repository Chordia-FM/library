# Chordia self-hosted library configuration.
# Copy to `chordia-library.toml` (or set CHORDIA_LIBRARY_CONFIG to point to it).
#
# Library folders and pairing credentials are not stored here. They are configured through
# the browser setup flow (the URL printed on first start) and saved in data/pairing.json.

# Port the server listens on. Open/forward this port so authorized clients and friends'
# libraries can reach you directly.
bind_port = 8443

# The Central Hub this server pairs with.
backend_url = "https://api.chordia.dev"   # dev: http://localhost:8080

# Where the local SQLite index, scrobble queue, and pairing credentials are stored.
data_dir = "./data"

# Frontend URL - where the setup flow redirects your browser after visiting the setup link.
frontend_url = "http://localhost:3000"   # production: https://chordia.dev

# Optional: your server's public URL. Set this so the Hub can advertise it to peers.
# hub_endpoint = "https://music.example.com:8443"

# Log format: "pretty" for human-readable output, "json" for structured logging.
log_format = "pretty"

# Lower quality tiers (High/Normal/DataSaver) are transcoded on the fly with ffmpeg and cached on
# disk. The Original tier is always bit-perfect passthrough and needs none of this. Spatial/Atmos
# tracks are never transcoded. This whole section is optional; sensible defaults are shown.
[transcode]
# ffmpeg must be installed and on PATH (or give an absolute path here).
ffmpeg_path = "ffmpeg"
# Where to cache transcoded files. Defaults to "{data_dir}/transcode".
# cache_dir = "./data/transcode"
# Evict least-recently-served cached files once the cache exceeds this (bytes). Default 5 GiB.
cache_max_bytes = 5368709120
# Max simultaneous ffmpeg processes.
max_concurrent = 2

# Acoustic fingerprinting. With the Chromaprint `fpcalc` binary installed, a background pass
# identifies each track so the same recording matches across different encodings (the preferred
# own-copy match layer), and untagged imports get an album, track numbers and artwork.
#
# `fpcalc` always runs locally because it reads the audio. Only the fingerprint leaves this host -
# a lossy one-way hash, never audio - and the lookup itself can go one of two ways:
#
#   Paired to a Hub: nothing to set. The Hub holds one AcoustID key (ACOUSTID_API_KEY there) and
#   identifies for every library attached to it, caching responses and sharing one rate budget.
#
#   Running standalone: set api_key below with a free key from https://acoustid.org/new-application.
#   A library is a complete music server on its own - client plus library, no Hub - so it identifies
#   on its own too. Also the fallback if your Hub has no key, or you use local metadata storage.
#
# The whole block is optional; set fpcalc_path only if the binary isn't on PATH.
# [acoustid]
# fpcalc_path = "fpcalc"
# api_key = "your-acoustid-key"   # only when there's no Hub to ask

# EBU R128 loudness analysis (ReplayGain). A background pass measures each track's integrated
# loudness + true peak with ffmpeg (reusing [transcode] ffmpeg_path) and stores a ReplayGain 2.0
# track gain. Clients apply it when "Normalize volume" is enabled, so tracks play at an even volume
# without clipping. On by default; set enabled = false to skip it (e.g. on a CPU-constrained box).
[loudness]
enabled = true

# Periodic library maintenance. The filesystem watcher handles live changes; this scheduler also
# re-scans and prunes deleted files every interval_minutes, catching changes missed while the server
# was down or if a watcher event was dropped. A full rescan re-hashes files, so keep this coarse.
# Set interval_minutes = 0 to rely on the live watcher alone.
[scan]
interval_minutes = 360
# When the same track exists in multiple encodings (e.g. you re-added an album in higher quality),
# keep only the highest-quality copy in the catalog and move the lower-quality file(s) into a
# recoverable `superseded/` folder under data_dir (never a hard delete). Matching is high-confidence
# only (same album, disc, track, and title), so remixes and live versions are never merged. Set
# false to keep every copy.
dedupe_reuploads = true

# Optional torrent-based acquisition (Lidarr-style). When enabled, the library executes download
# jobs you trigger from the Manager: it searches YOUR Prowlarr for releases, scores them against
# your quality profile (always preferring the highest-quality source), hands the pick to YOUR
# qBittorrent, then imports the finished files into the target library so they're indexed and synced.
# Chordia ships no indexers or trackers. You supply your own Prowlarr + qBittorrent (see the
# compose sidecars in deploy/compose.prod.yaml). You are responsible for the legality of what you
# acquire in your jurisdiction. Off unless enabled = true AND the Prowlarr/qBittorrent URLs are set.
# [acquisition]
# enabled = true
# prowlarr_url = "http://prowlarr:9696"
# prowlarr_api_key = "your-prowlarr-api-key"     # Prowlarr → Settings → General → API Key
# qbit_url = "http://qbittorrent:8080"
# qbit_user = "admin"
# qbit_pass = "your-qbittorrent-password"
# Where qBittorrent saves in-progress downloads. Keep this OUTSIDE your music root (so partial
# downloads aren't indexed); finished files are moved into "{music root}/_incoming". For atomic
# (instant) imports, put it on the same filesystem/volume as your music. Default {data_dir}/acquisition.
# staging_dir = "/downloads"
# import_subdir = "_incoming"        # subfolder of the music root finished downloads land in
# poll_interval_secs = 20            # how often to check the Hub for new download jobs
# keep_seeding = true                # true: hardlink/copy imports so the torrent keeps seeding.
#                                    # false: move files into the library and remove the torrent once
#                                    # imported (no seeding). Default true.
#
# Remote / shared-seedbox mode: run qBittorrent elsewhere (a seedbox) and read finished files from a
# LOCAL MOUNT of its download directory. Set BOTH remote_path (the path qBittorrent reports, e.g.
# "/downloads") and local_path (where that directory is mounted on this machine). In this mode files
# are copied, never moved, and the torrent keeps seeding on the seedbox. On Windows, `chordia mount`
# sets up the rclone mount for you.
# remote_path = "/downloads"
# local_path = "/mnt/seedbox"
# category = "chordia"               # qBittorrent category for THIS library's grabs, so libraries
#                                    # sharing one seedbox can tell their torrents apart. Default chordia.
#
# research_interval_days = 7         # how often to re-search a followed-artist release that wasn't on
#                                    # the trackers yet (reuses its job, never a duplicate). Reported
#                                    # to the Hub on the health heartbeat. Default 7.

# Optional in-process HTTPS. Set both cert and key (PEM) to terminate TLS here and advertise the
# leaf-certificate fingerprint to the Hub. Peers and native clients pin it, so a self-signed cert
# is safe against MITM. Leave this section out to serve plain HTTP behind edge TLS (Cloudflare
# Tunnel, Caddy, nginx), which is the recommended setup for browser clients (they can't pin
# self-signed certs).
# [tls]
# cert = "/etc/chordia/cert.pem"
# key  = "/etc/chordia/key.pem"
